name: Ошибка в приложении
description: Сообщить о воспроизводимой проблеме Орбиты
title: "[Ошибка] "
body:
  - type: markdown
    attributes:
      value: Не прикладывайте личную базу, пароли, рабочие документы и полный журнал. На снимках экрана скройте личные сведения.
  - type: input
    id: version
    attributes:
      label: Версия Орбиты
      description: Указана в «О приложении».
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Версия Windows и архитектура
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Опишите действия от запуска до ошибки.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Ожидаемый и фактический результат
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Дополнительные сведения
      description: При проблемах интерфейса укажите масштаб экрана; при проблемах расписания — пояс и момент запуска без личного текста напоминаний.
